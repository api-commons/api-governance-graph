<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>API Governance Graph — walk the Guidance Stack, find where it breaks</title>
    <meta name="description" content="Bind API governance building blocks — rules, policies, provenance, guidance, experiences, and solutions — into one navigable graph. Walk from any rule up to the human why, and see exactly where the stack is broken. Runs entirely in your browser." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Google tag (gtag.js) — API Commons -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WNSPT4B4S8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WNSPT4B4S8');
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <strong>API Governance Graph</strong>
        <span class="tag">graph.apicommons.org</span>
      </div>
      <nav>
        <a href="#" id="nav-about" title="What this graph is">About</a>
        <a href="https://apis.io" target="_blank" rel="noopener">APIs.io</a>
        <a href="https://apicommons.org" target="_blank" rel="noopener">API Commons</a>
        <a href="https://github.com/api-commons/api-governance-graph" target="_blank" rel="noopener">GitHub</a>
        <button id="engage-ae" class="engage-btn" type="button" title="Work with API Evangelist on API governance">Get help</button>
      </nav>
    </header>
    <!-- Laneworks ad network (ads.laneworks.net) -->
    <script async src="https://ads.laneworks.net/embed.js"></script>
    <div data-laneworks-ad="top-banner"></div>


    <div class="toolbar">
      <div class="views" role="tablist" aria-label="Views">
        <button class="view-tab is-active" data-view="stack" role="tab">Stack</button>
        <button class="view-tab" data-view="gaps" role="tab">Gaps</button>
        <button class="view-tab" data-view="experience" role="tab">By experience</button>
      </div>
      <div class="search">
        <input id="search" type="search" placeholder="Filter nodes — rule id, policy, experience…" autocomplete="off" />
      </div>
      <div class="counts" id="counts" aria-live="polite"></div>
    </div>

    <main class="stage">
      <section class="canvas" id="canvas" aria-label="Governance graph">
        <div class="loading" id="loading">Loading the governance graph…</div>
      </section>
      <aside class="detail" id="detail" hidden>
        <button class="detail-close" id="detail-close" type="button" aria-label="Close">&times;</button>
        <div id="detail-body"></div>
      </aside>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
